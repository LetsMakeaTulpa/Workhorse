services:
  - type: web
    name: workhorse
    runtime: python
    plan: free
    buildCommand: npm ci && npm run build && cd fieldwork-search && pip install -r requirements.txt
    startCommand: cd fieldwork-search && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: SEARXNG_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://letsmakeatulpa.github.io
      - key: FEATHERLESS_MODEL_ID
        value: darkc0de/XORTRON-RICO-v3
      - key: XORTRON_AGENT_MODEL_ID
        value: darkc0de/XORTRON-AgentRICO
